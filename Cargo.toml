[workspace]
members = [".", "crates/coinbase-exchange-fix"]

[package]
name = "muninn-coinbase-connector"
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coinbase-exchange-fix = { path = "crates/coinbase-exchange-fix" }
muninn-plugin = "1.3"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util"] }
